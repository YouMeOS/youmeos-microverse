appId: com.youmeos.microverse
productName: My YouMeOS Microverse
directories:
  output: out
extraResources:
  - from: ../docker-compose.yml
    to: docker-compose.yml
  - from: ../docker
    to: docker
    filter:
      - "**/*"
  - from: ../blackbox
    to: blackbox
    filter:
      - "**/*"
  - from: ../scripts
    to: scripts
    filter:
      - "**/*"
publish:
  provider: github
mac:
  target: dmg
  icon: assets/icon.png
win:
  target: nsis
  icon: assets/icon.png
linux:
  maintainer: YouMeOS <contact@youmeos.com>
  category: Utility
  icon: assets/icon.png
  target:
    - AppImage
    - deb
