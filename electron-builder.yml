appId: com.youmeos.microverse
productName: My YouMeOS Microverse
directories:
  output: out
extraResources:
  - from: docker-compose.yml
    to: docker-compose.yml
  - from: docker
    to: docker
    filter:
      - "**/*"
  - from: blackbox
    to: blackbox
    filter:
      - "**/*"
  - from: scripts
    to: scripts
    filter:
      - "**/*"
  - from: bin
    to: bin
    filter:
      - "**/*"
publish:
  provider: github
  owner: YouMeOS
  repo: youmeos-microverse
mac:
  target: dmg
  icon: assets/icon.png
win:
  target:
    - nsis
    - msi
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
linux:
  maintainer: YouMeOS <youmeos@xophz.com>
  category: Utility
  icon: assets/icon.png
  target:
    - AppImage
    - deb
deb:
  packageName: my-youmeos-microverse
  artifactName: "my-youmeos-microverse_${version}_${arch}.${ext}"
