services:
  youmeos:
    build: .
    image: xengenie/youmeos:latest
    container_name: youmeos-microverse
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./wp-content:/var/www/html/wp-content
    environment:
      - PORT=80
      - HTTPS_PORT=443
      - WP_DEBUG=false
